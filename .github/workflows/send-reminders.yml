name: PulseNote — lembretes periódicos

# O plano Hobby da Vercel só permite Cron Jobs 1x por dia (e olhe lá, sem
# hora exata — só "em algum minuto dentro da hora marcada") — não serve
# pra lembrete de compromisso, que precisa disparar minutos antes do
# horário certo. O relógio de produção agora é um schedule assinado do
# QStash. Este workflow fica disponível somente para diagnóstico manual.
on:
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/send-reminders
        run: |
          curl -sS --fail-with-body --max-time 90 -X GET "https://pulse-note-5erj.vercel.app/api/send-reminders" \
            -H "Authorization: Bearer ${{ secrets.REMINDERS_CRON_SECRET }}"

