<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>PulseNote — Recuperar senha</title>
  <link rel="stylesheet" href="/src/auth.css"/>
</head>
<body class="auth-page">

  <div class="auth-bg"></div>

  <main class="auth-shell">

    <div class="auth-brand">
      <div class="brand-mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 13h5l2-7 4 14 2-7h7"/>
        </svg>
      </div>
      <div>
        <strong>PulseNote</strong>
        <span>Recuperar acesso</span>
      </div>
    </div>

    <div class="auth-card">

      <!-- Etapa 1: informar e-mail -->
      <div id="stepEmail">
        <div class="auth-mascot" aria-hidden="true">
          <div class="pulsinho">
            <div class="pulsinho__face">
              <div class="pulsinho__eyes"><span class="pulsinho__eye"></span><span class="pulsinho__eye"></span></div>
              <svg class="pulsinho__pulse" viewBox="0 0 120 26"><path d="M0,13 L28,13 L36,3 L44,23 L52,13 L64,13 L70,6 L76,20 L82,13 L120,13"/></svg>
            </div>
          </div>
        </div>
        <h1 class="auth-title auth-title--center">Esqueceu a senha?</h1>
        <p class="auth-subtitle auth-subtitle--center">Informe seu e-mail e enviaremos um link seguro para criar uma nova senha.</p>

        <form id="forgotForm" class="auth-form active-form">
          <div class="field-group">
            <label class="field-label" for="forgotEmail">E-mail cadastrado</label>
            <div class="field-wrap">
              <span class="field-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="m3 6.5 9 6.5 9-6.5"/></svg></span>
              <input id="forgotEmail" type="email" class="field-input" placeholder="seu@email.com" required/>
            </div>
          </div>

          <div id="forgotError" class="auth-error" hidden></div>

          <button type="submit" class="auth-btn" id="forgotBtn">
            <span class="btn-text">Enviar link de redefinição</span>
            <span class="btn-spinner" hidden></span>
          </button>
        </form>
      </div>

      <!-- Etapa 2: sucesso -->
      <div id="stepSuccess" hidden>
        <div class="pulsinho auth-mascot-standalone mood-happy" aria-hidden="true">
          <div class="pulsinho__face">
            <div class="pulsinho__eyes"><span class="pulsinho__eye"></span><span class="pulsinho__eye"></span></div>
            <svg class="pulsinho__pulse" viewBox="0 0 120 26"><path d="M0,13 L28,13 L36,3 L44,23 L52,13 L64,13 L70,6 L76,20 L82,13 L120,13"/></svg>
          </div>
        </div>
        <h1 class="auth-title auth-title--center">E-mail enviado!</h1>
        <p class="auth-subtitle auth-subtitle--center">
          Se este e-mail estiver cadastrado, você receberá um link para redefinir sua senha em poucos minutos.<br/><br/>
          Verifique também a caixa de spam.
        </p>
      </div>

      <div class="auth-back-link">
        <a href="/login" class="auth-link">← Voltar para o login</a>
      </div>

    </div>
  </main>

  <script type="module" src="/src/auth.js"></script>
</body>
</html>
